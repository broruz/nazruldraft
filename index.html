<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Masuk - Nazrul Nazir & Co</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo-placeholder">NN</div>
    <h1>Nazrul Nazir & Co</h1>
    <p class="subtitle">Sistem Pengurusan Kes</p>
    <input type="email" id="email" placeholder="Emel" autocomplete="username">
    <input type="password" id="password" placeholder="Kata Laluan" autocomplete="current-password">
    <button id="loginBtn">Log Masuk</button>
    <p class="error-msg" id="errorMsg"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
async function checkExistingSession() {
  const { data } = await supabaseClient.auth.getSession();
  if (data.session) window.location.href = "app.html";
}
checkExistingSession();

document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn = document.getElementById("loginBtn");
  const errorMsg = document.getElementById("errorMsg");
  errorMsg.style.display = "none";

  if (!email || !password) {
    errorMsg.textContent = "Sila isi emel dan kata laluan.";
    errorMsg.style.display = "block";
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span>';

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

  btn.disabled = false;
  btn.textContent = "Log Masuk";

  if (error) {
    errorMsg.textContent = "Emel atau kata laluan salah, atau akaun belum wujud.";
    errorMsg.style.display = "block";
    return;
  }
  window.location.href = "app.html";
}
</script>
</body>
</html>
